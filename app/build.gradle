plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.piercingxx.txxt'
    compileSdk 35

    defaultConfig {
        applicationId "com.piercingxx.txxt"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        unitTests {
            returnDefaultValues true
        }
    }
    // Export the Room schema so it can be committed and diffed across versions.
    // Room writes a JSON schema per version into this directory.
    kapt {
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ActivityResultContracts.PickVisualMedia — the Android photo picker. Pinned
    // explicitly because appcompat 1.6.1 only drags in androidx.activity 1.6.0,
    // and the photo-picker contract landed in 1.7.0. The library's own manifest
    // declares NO permissions, which is the point: the picker gives access to
    // exactly the one photo the operator chose, so attaching a photo costs the
    // app nothing on its permission list (scripts/verify_privacy_claims.py
    // asserts the built APK's list is unchanged).
    //
    // Pinned to 1.8.2 and NOT higher on purpose: it is the newest version whose
    // transitive androidx.core (1.8.0) stays below appcompat's own 1.9.0, so
    // adding the picker moves NOTHING else in the resolved dependency graph.
    // From activity 1.9.0 core jumps to 1.13.0 and drags lifecycle/core
    // upgrades in behind it — a much larger blast radius than one contract
    // class is worth on an app whose shipped artifact is asserted
    // permission-by-permission.
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'

    // Room database
    implementation 'androidx.room:room-runtime:2.7.1'
    kapt 'androidx.room:room-compiler:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'

    // Pure core model (Conversation, Message, ConversationFlags)
    implementation project(':core')

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    // MockK lets a plain JVM unit test drive the Android BroadcastReceiver
    // (mockkStatic on the mockable android.jar Telephony class) without
    // Robolectric, which is not in the offline cache. 1.13.10 is in the cache.
    testImplementation 'io.mockk:mockk:1.13.10'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}