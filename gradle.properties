android.useAndroidX=true
# kapt (Room) needs more than the 512m default on a cold build.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true

# Run every build with a single-use daemon instead of a persistent one (the
# --no-daemon equivalent, set here so every build, including the gate's plain
# `./gradlew testDebugUnitTest --offline`, inherits it). The persistent daemon
# is started once and reused across builds; when the build sandbox is
# (re)entered, that daemon keeps a read-only filesystem view and every later
# gate run dies on "Read-only file system" trying to mmap-lock
# .gradle/.../fileHashes.lock or to create build/reports/problems. A single-use
# daemon forks fresh inside the current sandbox context, so the workspace is
# writable and the gate passes (verified: the plain gate command succeeds only
# with --no-daemon). This mirrors the
# kotlin.compiler.execution.strategy=in-process setting below, which exists for
# the same sandbox reason.
org.gradle.daemon=false

# Compile Kotlin in-process (inside the Gradle daemon) instead of a separate
# Kotlin daemon. The Kotlin daemon writes its client marker to
# ~/.local/share/kotlin/daemon/, which is read-only in the build sandbox; the
# failed write ("Read-only file system" / "Could not connect to Kotlin compile
# daemon") was polluting every cold-build gate run and littering .kotlin/errors/
# with logs. In-process compilation avoids the daemon entirely and keeps the
# gate output clean. Valid values: daemon, in-process, embeddable.
kotlin.compiler.execution.strategy=in-process