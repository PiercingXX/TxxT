android.useAndroidX=true
# kapt (Room) needs more than the 512m default on a cold build.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true

# Compile Kotlin in-process (inside the Gradle daemon) instead of a separate
# Kotlin daemon. The Kotlin daemon writes its client marker to
# ~/.local/share/kotlin/daemon/, which is read-only in the build sandbox; the
# failed write ("Read-only file system" / "Could not connect to Kotlin compile
# daemon") was polluting every cold-build gate run and littering .kotlin/errors/
# with logs. In-process compilation avoids the daemon entirely and keeps the
# gate output clean. Valid values: daemon, in-process, embeddable.
kotlin.compiler.execution.strategy=in-process